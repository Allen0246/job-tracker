# Eightfold ATS — one API shape covers every tenant, confirmed against all
# three real hosts: only `host` and `domain` differ per company, everything
# else in the request is identical. See tracker/eightfold.py.
#
# Endpoint: GET https://<host>/api/pcsx/search?domain=<domain>&location=...
# Confirmed cold-callable (no cookies/CSRF/session) and explicitly allowed
# by robots.txt (`Allow: /api/pcsx`) on all three hosts.
companies:
  - name: Morgan Stanley
    host: morganstanley.eightfold.ai
    domain: morganstanley.com
    location: "Budapest,  Hungary"

  - name: Ericsson
    host: ericsson.eightfold.ai
    domain: ericsson.com
    location: "Budapest,  Hungary"

  - name: Vodafone
    host: vodafone.eightfold.ai
    domain: vodafone.com
    location: "Budapest,  Hungary"

# Search radius in km around `location`, and whether to include postings
# tagged fully remote. Same value profession.hu's own site used in the
# captured requests; wide enough to not miss anything, filtering happens
# in tracker/filter.py same as every other source.
filter_distance: 160
filter_include_remote: 1
