# iCIMS — the human-facing search page is a wrapper; real content loads
# in a same-origin iframe. Appending &in_iframe=1 to any iCIMS URL (list
# or detail) fetches that iframe's target directly, server-rendered, no
# JS needed — confirmed via the page's own noscript <iframe
# src="...&in_iframe=1"> fallback. robots.txt only disallows referral/
# login/candidate/reminder sub-paths, not /jobs/search or a job's own
# detail page.
companies:
  - name: One Identity
    host: careers-oneidentity.icims.com
    search_url: "https://careers-oneidentity.icims.com/jobs/search?ss=1&searchLocation=13226--Budapest"
