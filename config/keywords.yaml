# Filter rules as data. filter.py reads this file fresh on every run, so
# tuning criteria is a re-run over already-stored postings, never a re-crawl
# and never a code change. Matching is case-insensitive substring matching
# against the combined text of: title, tech_stack, task_summary, benefits,
# language_req, experience_level, and (for survivors) the detail page body.
#
# Three gates, all must pass for a posting to reach the digest:
#   stack     - weighted keyword score >= stack.threshold
#   level     - not disqualified as too senior; <3yr experience bar
#   direction - weighted keyword score >= direction.threshold, backend/DevOps/
#               automation; not disqualified as a testing role

stack:
  threshold: 3
  positive:
    python: 3
    django: 2
    fastapi: 2
    flask: 2
    postgres: 1
    postgresql: 1
    docker: 1
    kubernetes: 1
    "rest api": 1
    "ci/cd": 1
    git: 1
    linux: 1
    aws: 1
    azure: 1
    celery: 1
    redis: 1
    microservice: 1
    "c++": 1
  negative:
    php: -2
    wordpress: -2

level:
  # Enforced two ways: word-based via `disqualifiers` below, and numerically
  # — any "N years"/"N-M years"/"N éves" mention in the combined text with
  # N above this cap hard-disqualifies (filter.py's _exceeds_experience_cap),
  # so "Junior Developer, 5 years experience required" is caught even though
  # the title alone reads as junior-friendly.
  max_years_experience: 3
  # Structural signal from the card's own experience field. Most sources
  # have no structured level field at all (confirmed: Morgan Stanley's
  # Eightfold postings and GE HealthCare's Phenom postings carry one,
  # most others don't), so free-text matches against the title/
  # description below carry the actual weight for those.
  # Matched against the full combined text (title/description/etc).
  # "intern"/"co-op" are deliberately absent: an internship or co-op
  # posting shouldn't qualify just because it's junior-friendly — those
  # roles aren't wanted regardless of level.
  ok_experience_text:
    - "professional experience is not required"
    - "career starter"
    - "0-2"
    - "1-3"
    - "2-3"
    - junior
  # Matched ONLY against the structured experience_level field (never the
  # general text) — a controlled-vocabulary value from a specific source,
  # not a phrase to trust wherever it happens to appear. "early career" is
  # GE HealthCare's own Phenom experienceLevel value, and that source
  # keeps it cleanly distinct from "Co-op/Intern" and "Mid-Career" — but
  # the same words as loose text elsewhere ("our early career program...")
  # aren't the same reliable signal, so they don't qualify a posting here.
  ok_experience_level_values:
    - "early career"
  # Any of these anywhere in the combined text hard-disqualifies, regardless
  # of the structural signal above (catches "senior" mentioned in the title
  # even when the experience field itself looks junior-friendly). Explicit
  # year ranges like "5-10 years" don't need an entry here anymore — the
  # numeric check above catches those and plain "5 years" alike.
  disqualifiers:
    - senior
    - szenior # Hungarian spelling of "senior" — doesn't substring-match "senior" (the "z" breaks it)
    - vezető
    - lead
    - principal
    - architect
    - "executive management"

direction:
  threshold: 2
  positive:
    backend: 3
    "back-end": 3
    devops: 3
    automation: 2
    automatizáció: 2
    "server-side": 2
    infrastructure: 1
    api: 1
    cloud: 1
  negative:
    frontend: -3
    "front-end": -3
    react: -1
    angular: -1
    "vue.js": -1
    "ui/ux": -2
    designer: -2
  # Testing roles hard-disqualify even though "automation" is a positive
  # signal above: "QA Automation Engineer" scores automation:2 and often
  # python:3 on stack, clearing both thresholds despite being a testing
  # job, not a developing job. Substring match against the same combined
  # text as the level gate.
  disqualifiers:
    - "test automation"
    - "qa automation"
    - sdet
    - "quality assurance"
    - "qa engineer"
    - "software tester"
    - "test engineer"
    - "manual tester"
    - tesztmérnök
    - tesztelő
    - minőségbiztosítás
    - "teszt automatizálás"
