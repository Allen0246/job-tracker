# Filter rules as data. filter.py reads this file fresh on every run, so
# tuning criteria is a re-run over already-stored postings, never a re-crawl
# and never a code change. Matching is case-insensitive substring matching
# against the combined text of: title, tech_stack, task_summary, benefits,
# language_req, experience_level, and (for survivors) the detail page body.
#
# Three gates, all must pass for a posting to reach the digest:
#   stack     - weighted keyword score >= stack.threshold
#   level     - not disqualified as too senior; <3yr experience bar
#   direction - weighted keyword score >= direction.threshold, backend/DevOps/automation

stack:
  threshold: 3
  positive:
    python: 3
    django: 2
    fastapi: 2
    flask: 1
    postgres: 1
    postgresql: 1
    docker: 1
    kubernetes: 1
    "rest api": 1
    "ci/cd": 1
    git: 1
    linux: 1
    aws: 1
    azure: 1
    celery: 1
    redis: 1
    microservice: 1
  negative:
    php: -2
    wordpress: -2
    ".net": -1
    java: -1
    "c#": -1

level:
  max_years_experience: 3
  # Structural signal from the card's own experience field (data-category4).
  # These substrings, if present in experience_level, pass the gate outright.
  ok_experience_text:
    - "professional experience is not required"
    - "career starter"
    - "0-2"
    - "1-3"
  # Any of these anywhere in the combined text hard-disqualifies, regardless
  # of the structural signal above (catches "senior" mentioned in the title
  # even when the experience field itself looks junior-friendly).
  disqualifiers:
    - senior
    - vezető
    - lead
    - principal
    - architect
    - "5-10 years"
    - "10+ years"
    - ">10 years"
    - "executive management"

direction:
  threshold: 2
  positive:
    backend: 3
    "back-end": 3
    devops: 3
    automation: 2
    automatizáció: 2
    "server-side": 2
    infrastructure: 1
    api: 1
    cloud: 1
  negative:
    frontend: -3
    "front-end": -3
    react: -1
    angular: -1
    "vue.js": -1
    "ui/ux": -2
    designer: -2
