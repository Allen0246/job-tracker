# Filter rules as data. filter.py reads this file fresh on every run, so
# tuning criteria is a re-run over already-stored postings, never a re-crawl
# and never a code change. Matching is case-insensitive whole-word matching
# (so "lead" doesn't hit "leading", "git" doesn't hit "digital") against
# the combined text of: title, tech_stack, task_summary, benefits,
# language_req, experience_level, and (for survivors) the detail page body.
#
# Three gates, all must pass for a posting to reach the digest:
#   stack     - weighted keyword score >= stack.threshold
#   level     - not disqualified as too senior; <3yr experience bar
#   direction - weighted keyword score >= direction.threshold, backend/DevOps/
#               automation; not disqualified as a testing role
#
# A trailing "*" means "this word plus any suffix": use it for plurals and
# Hungarian inflected forms ("vezető*" also hits "vezetőt", "vezetője").
# A leading "*" means "anything in front", for Hungarian compounds written
# as one word ("*menedzser" also hits "projektmenedzser").
# Always quote such terms — a bare * is YAML alias syntax.

stack:
  threshold: 3
  positive:
    python: 3
    django: 2
    fastapi: 2
    flask: 2
    postgres: 1
    postgresql: 1
    docker: 1
    kubernetes: 1
    "rest api": 1
    "ci/cd": 1
    git: 1
    linux: 1
    aws: 1
    "microservice*": 1
    "c++": 1
    golang: 1 # not plain "go": that's an everyday English word
  negative:
    php: -2
    wordpress: -2

level:
  # Enforced two ways: word-based via `disqualifiers` below, and numerically
  # — any "N years"/"N-M years"/"N éves" mention in the combined text with
  # N above this cap hard-disqualifies (filter.py's _exceeds_experience_cap),
  # so "Junior Developer, 5 years experience required" is caught even though
  # the title alone reads as junior-friendly.
  max_years_experience: 3
  # Structural signal from the card's own experience field (data-category4).
  # These terms, if present in experience_level, pass the gate outright.
  ok_experience_text:
    - "professional experience is not required"
    - "career starter"
    - "0-2"
    - "1-3"
    - "2-3"
    - "junior*"
    - "medior*"
  # Any of these anywhere in the combined text (title, card fields AND the
  # full description) hard-disqualifies, regardless
  # of the structural signal above (catches "senior" mentioned in the title
  # even when the experience field itself looks junior-friendly). Explicit
  # year ranges like "5-10 years" don't need an entry here anymore — the
  # numeric check above catches those and plain "5 years" alike.
  disqualifiers:
    - senior
    - "szenior*" # Hungarian spelling of "senior" — doesn't substring-match "senior" (the "z" breaks it)
    - "vezető*"
    - lead
    - principal
    - architect
    - "executive management"
  # Same, but checked against the job TITLE only. Internships, trainee and
  # student jobs aren't wanted regardless of level, but a normal job's
  # description can mention them innocently ("we also run an internship
  # program"). Whole-word "intern" so "internal"/"international" don't
  # match; "gyakornok*" is the Hungarian (also covers "gyakornoki
  # program"), "diákmunka" is student work, with and without the accent.
  title_disqualifiers:
    - intern
    - "internship*"
    - "gyakornok*"
    - "trainee*"
    - "diákmunka*"
    - "diakmunka*"

direction:
  threshold: 2
  positive:
    backend: 3
    "back-end": 3
    devops: 3
    automation: 2
    "automatizáció*": 2
    "server-side": 2
    infrastructure: 1
    api: 1
    cloud: 1
  negative:
    frontend: -3
    "front-end": -3
    react: -1
    angular: -1
    "vue.js": -1
    "ui/ux": -2
    designer: -2
  # Testing roles hard-disqualify even though "automation" is a positive
  # signal above: "QA Automation Engineer" scores automation:2 and often
  # python:3 on stack, clearing both thresholds despite being a testing
  # job, not a developing job. Checked against the job TITLE only: a
  # developer's description often mentions testing innocently ("work
  # closely with our QA engineer", "test automation is a plus").
  title_disqualifiers:
    # Not testing roles, but the same idea: a negative score alone gets
    # outweighed by "automation"/"cloud"/"api" in a BI/data posting's
    # description, so these are rejected by title outright.
    - "bi developer*"
    - "data engineer*" # also "Data Engineering Intern" etc.
    # System administrator roles ("rendszergazda*" is in the full-text list
    # below, so it also catches sysadmin requirements in a description).
    - "system administrator*"
    - "sysadmin*"
    # Manager roles of any kind (application/project/product/engineering).
    # Whole word, so "management" in a title doesn't match.
    - "manager*"
    - "*menedzser*" # also "projektmenedzser"
    - "test automation"
    - "qa automation"
    - sdet
    - "quality assurance"
    - "qa engineer"
    - "software tester"
    - "test engineer"
    - "manual tester"
    - "*tesztmérnök*"
    - "*tesztelő*" # also "szoftvertesztelő"
    - "minőségbiztosítás*"
    - "teszt automatizálás*"
  # Checked against the whole posting, description included. Sysadmin work
  # isn't wanted even as part of another role: any mention of it
  # ("Magabiztos RHEL/RHCOS rendszergazdai tudás") rejects the posting.
  disqualifiers:
    - "rendszergazda*"
