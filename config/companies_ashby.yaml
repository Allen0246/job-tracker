# Ashby — job board data is embedded directly in the page's own
# window.__appData JS blob, both for the list (jobBoard.jobPostings)
# and the detail (posting.descriptionHtml, the full HTML body already
# inline). No request to /api/ needed — good, since robots.txt
# disallows /api/ entirely on jobs.ashbyhq.com.
companies:
  - name: SEON
    org_slug: SEON

location_match:
  - budapest
  - hungary
